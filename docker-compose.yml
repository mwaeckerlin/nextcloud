services:
  nextcloud-nginx:
    extends:
      file: ./nginx/docker-compose.yml
      service: nextcloud-nginx
    ports:
      - "8824:8080"
    environment:
      PHP_FPM_HOST: nextcloud-php-fpm
    depends_on:
      nextcloud-php-fpm:
        condition: service_started
    networks:
      - php-network

  nextcloud-php-fpm:
    extends:
      file: ./php-fpm/docker-compose.yml
      service: nextcloud-php-fpm
    environment:
      HOST: ""
      PROTOCOL: https
      ADMIN_USER: admin
      WEBROOT: ""
      DEBUG: "0"
      MYSQL_HOST: nextcloud-db
      MYSQL_USER: nextcloud
      MYSQL_DATABASE: nextcloud
    secrets:
      - nextcloud_db_password
      - nextcloud_admin_password
    volumes:
      - data:/app/data
      - config:/app/config
      - apps:/app/apps
    depends_on:
      nextcloud-db:
        condition: service_started
    networks:
      - php-network
      - db-network

  nextcloud-db:
    image: mariadb
    environment:
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD_FILE: /run/secrets/nextcloud_db_password
      MYSQL_RANDOM_ROOT_PASSWORD: yes
    secrets:
      - nextcloud_db_password
    volumes:
      - db:/var/lib/mysql
    networks:
      - db-network

  access-fix:
    image: mwaeckerlin/allow-write-access
    volumes:
      - data:/app/data
      - config:/app/config
      - apps:/app/apps

secrets:
  nextcloud_db_password:
    environment: NEXTCLOUD_DB_PASSWORD
    #external: true
  nextcloud_admin_password:
    environment: NEXTCLOUD_ADMIN_PASSWORD
    #external: true

volumes:
  data:
  config:
  apps:
  db:


networks:
  php-network:
    driver_opts:
      encrypted: 1
  db-network:
    driver_opts:
      encrypted: 1
