services:
  nextcloud-nginx:
    extends:
      file: ./nginx/docker-compose.yml
      service: nextcloud-nginx
    ports:
      - "${NEXTCLOUD_HTTP_PORT:-8824}:8080"
    environment:
      WEBROOT: ${WEBROOT}
      MAX_INPUT_TIME: ${MAX_INPUT_TIME:-3600}
    volumes:
      - apps:/app/custom_apps:ro
    depends_on:
      nextcloud-php-fpm:
        condition: service_healthy
    networks:
      - nxinx-php
      - nginx-collabora
      - nginx-push

  nextcloud-php-fpm:
    extends:
      file: ./php-fpm/docker-compose.yml
      service: nextcloud-php-fpm
    environment:
      HOST: ${HOST:-localhost:${NEXTCLOUD_HTTP_PORT:-8824}}
      PROTOCOL: ${PROTOCOL:-http}
      WEBROOT: ${WEBROOT}
      UPLOAD_MAX_FILESIZE: ${UPLOAD_MAX_FILESIZE:-8G}
      MAX_INPUT_TIME: ${MAX_INPUT_TIME:-3600}
      MEMORY_LIMIT: ${MEMORY_LIMIT:-1000M}
      MYSQL_HOST: nextcloud-db
      REDIS_HOST: redis
      LOG_MAX_SIZE: ${LOG_MAX_SIZE:-100M}
      NOTIFY_PUSH_HOST: notify-push
      NOTIFY_PUSH_ENDPOINT: ${NOTIFY_PUSH_ENDPOINT:-}
    secrets:
      - nextcloud_db_password
      - nextcloud_admin_password
    volumes:
      - data:/app/data
      - config:/app/config
      - apps:/app/custom_apps
    depends_on:
      nextcloud-db:
        condition: service_started
      collabora:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - nxinx-php
      - php-db
      - php-smtp
      - php-collabora
      - php-redis

  # Client Push: reads the database from config.php of the config volume,
  # talks to Redis, and checks its clients against Nextcloud through nginx
  notify-push:
    extends:
      file: ./notify-push/docker-compose.yml
      service: notify-push
    environment:
      # Nextcloud as the push server reaches it, below the same WEBROOT
      NEXTCLOUD_URL: http://nextcloud-nginx:8080${WEBROOT:-}
    volumes:
      - config:/app/config:ro
    depends_on:
      nextcloud-php-fpm:
        condition: service_healthy
    networks:
      - nginx-push
      - php-db
      - php-redis

  # file locking and distributed cache of Nextcloud and the messages of Client
  # Push; reachable only from nextcloud-php-fpm and notify-push
  redis:
    image: mwaeckerlin/redis
    volumes:
      - redis:/data
    networks:
      - php-redis

  smtp-relay:
    image: mwaeckerlin/smtp-relay
    networks:
      - php-smtp

  collabora:
    image: collabora/code
    environment:
      server_name: ${HOST:-localhost:${NEXTCLOUD_HTTP_PORT:-8824}}
      domain: nextcloud-nginx|localhost
      aliasgroup1: http://nextcloud-nginx:8080,http://localhost:${NEXTCLOUD_HTTP_PORT:-8824}
      extra_params: --o:ssl.enable=false --o:ssl.termination=false
    cap_add:
      - MKNOD
    networks:
      - nginx-collabora
      - php-collabora

  nextcloud-db:
    image: mariadb
    # 96M of the image are below the 128M the database checks of the admin
    # overview ask for; 256M is the value they recommend
    command: --innodb-log-file-size=256M
    environment:
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD_FILE: /run/secrets/nextcloud_db_password
      MYSQL_RANDOM_ROOT_PASSWORD: yes
    secrets:
      - nextcloud_db_password
    volumes:
      - db:/var/lib/mysql
    networks:
      - php-db

  access-fix:
    image: mwaeckerlin/allow-write-access
    volumes:
      - data:/app/data
      - config:/app/config
      - apps:/app/custom_apps

secrets:
  nextcloud_db_password:
    environment: NEXTCLOUD_DB_PASSWORD
    #external: true
  nextcloud_admin_password:
    environment: NEXTCLOUD_ADMIN_PASSWORD
    #external: true

volumes:
  data:
  config:
  apps:
  db:
  redis:


networks:
  nxinx-php:
    driver_opts:
      encrypted: 1
  php-db:
    driver_opts:
      encrypted: 1
  php-smtp:
    driver_opts:
      encrypted: 1
  nginx-collabora:
    driver_opts:
      encrypted: 1
  php-collabora:
    driver_opts:
      encrypted: 1
  php-redis:
    driver_opts:
      encrypted: 1
  nginx-push:
    driver_opts:
      encrypted: 1
