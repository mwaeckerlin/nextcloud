# Apache prefork, one PHP process per worker. Every worker holds one database
# connection while it answers, so MAX_REQUEST_WORKERS (default 100) stays below
# max_connections of the database (151 by default). Requests above the limit
# wait in the listen backlog instead of failing with «Too many connections».
<IfModule mpm_prefork_module>
    StartServers             5
    MinSpareServers          5
    MaxSpareServers         10
    ServerLimit             ${MAX_REQUEST_WORKERS}
    MaxRequestWorkers       ${MAX_REQUEST_WORKERS}
    MaxConnectionsPerChild   0
</IfModule>
