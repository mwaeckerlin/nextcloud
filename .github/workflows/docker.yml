# Builds the images of this repository for amd64 and arm64 and publishes them
# on Docker Hub, on every push to a live branch, and in the hourly check when a
# parent image or a download changed or the image is a week old. The build itself is the reusable workflow
# docker-image.yml of mwaeckerlin/scratch; its README explains the setup.
#
# Nextcloud upgrades one major version at a time, so every major version has
# its own branch and its own tags. The same file stands on every live branch:
#   new      -> nginx, php-fpm                 (current release)
#   new-NN   -> nginx-ncNN, php-fpm-ncNN       (major version NN, from 30)
#               and nginx-NN, php-fpm-NN       (alias: the names before nc)
#   master   -> latest                         (legacy single image)
#   NN       -> NN                             (legacy, major version NN)
# A push to new also rebuilds new-30 to new-35: once its images are deployed,
# the shared workflow runs create-branches.sh on the pushed commit and builds
# every branch it pushed, so each major version publishes the version just
# pushed; that push needs «contents: write». A push to master rebuilds the
# legacy branches 13 to 35 the same way. Nextcloud 30 to 32 refuse PHP 8.5,
# so create-branches.sh builds new-30 on mwaeckerlin/php-fpm:8.3 and new-31
# and new-32 on mwaeckerlin/php-fpm:8.4.
#
# Every rule carries «version»: a published version never stands without its
# leading «v», so the tags read nginx-v1.1.15 and nginx-nc35-v1.1.15, the same
# form as the git tag of that release. A branch without a rule would publish a
# bare nginx-1.1.15, which is why master has one of its own.

name: docker

on:
  push:
    branches: [master, new, "new-*", "1[3-9]", "2[0-9]", "3[0-9]"]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      build:
        description: build without the source check
        type: boolean
        default: false

# one run per branch at a time; a branch never cancels the run of another
concurrency: docker-${{ github.ref_name }}

jobs:
  docker:
    uses: mwaeckerlin/scratch/.github/workflows/docker-image.yml@master
    permissions:
      actions: write
      contents: write
    with:
      version-base: new
      version-branches: ./create-branches.sh
      branch-tags: '[{"branch": "new-(3[0-9])", "suffix": "-nc\\1", "aliases": ["-\\1"], "version": "v"}, {"branch": "new", "suffix": "", "version": "v"}, {"branch": "(1[3-9]|2[0-9]|3[0-9])", "suffix": "-\\1", "version": "v"}, {"branch": "master", "suffix": "", "version": "v"}]'
    secrets: inherit
