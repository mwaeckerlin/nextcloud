Alias ${WEBROOT}/ ${INSTDIR}/

<Directory ${INSTDIR}/>
  Options +FollowSymlinks
  AllowOverride All

 <IfModule mod_dav.c>
  Dav off
 </IfModule>

  Options +FollowSymlinks
  AllowOverride All

 <IfModule mod_dav.c>
  Dav off
 </IfModule>

 # locked against .htaccess, which AllowOverride All lets set PHP flags:
 # the mitigation the advisory of CVE-2026-109619 names
 php_admin_flag session.upload_progress.enabled off

 SetEnv HOME ${INSTDIR}
 SetEnv HTTP_HOME ${INSTDIR}

</Directory>
