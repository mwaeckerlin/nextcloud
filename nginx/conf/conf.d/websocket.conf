# WebSocket upgrade helper.
#
# Apps benoetigen das Standard-nginx-Idiom fuer WebSocket-Reverse-Proxy:
#   proxy_set_header Upgrade    $http_upgrade;
#   proxy_set_header Connection $connection_upgrade;
# Diese map sorgt dafuer, dass die Connection: upgrade-Header nur bei
# echten Upgrade-Requests gesendet werden und sonst sauber geschlossen
# wird. Bei "Connection: upgrade" hart codiert wuerde nginx fuer alle
# proxy-Requests Keepalive deaktivieren.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
