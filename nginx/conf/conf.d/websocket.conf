# WebSocket upgrade helper.
#
# Apps need the standard nginx idiom for WebSocket reverse proxying:
#   proxy_set_header Upgrade    $http_upgrade;
#   proxy_set_header Connection $connection_upgrade;
# This map ensures the Connection: upgrade header is only sent on real
# upgrade requests and otherwise the connection is closed cleanly. If
# "Connection: upgrade" were hard-coded, nginx would disable keepalive
# for all proxy requests.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
