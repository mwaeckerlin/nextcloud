services:
  traefik:
    image: traefik
    environment:
      DOCKER_API_VERSION: "1.44"
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=ingress
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      - --certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --log.level=DEBUG
      - --log.format=json
      - --accesslog=true
      - --accesslog.format=json
      - --api.dashboard=true
      - --api.insecure=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt:/letsencrypt
    networks:
      - ingress
    restart: unless-stopped

  nextcloud-nginx:
    image: mwaeckerlin/nextcloud:nginx
    environment:
      PHP_FPM_HOST: nextcloud-php-fpm
      WEBROOT:
    volumes:
      - apps:/app/custom_apps:ro
    depends_on:
      nextcloud-php-fpm:
        condition: service_started
    networks:
      - php-network
      - collabora-network
      - ingress
    labels:
      - traefik.enable=true
      - traefik.docker.network=ingress

      # Canonical app router on apex domain.
      - traefik.http.routers.nextcloud.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.nextcloud.entrypoints=websecure
      - traefik.http.routers.nextcloud.tls=true
      - traefik.http.routers.nextcloud.tls.certresolver=letsencrypt
      - traefik.http.routers.nextcloud.service=nextcloud

      # Redirect www to apex on HTTPS.
      - traefik.http.routers.nextcloud-www.rule=Host(`www.${DOMAIN}`)
      - traefik.http.routers.nextcloud-www.entrypoints=websecure
      - traefik.http.routers.nextcloud-www.tls=true
      - traefik.http.routers.nextcloud-www.tls.certresolver=letsencrypt
      - traefik.http.routers.nextcloud-www.middlewares=redirect-www-to-apex
      - traefik.http.routers.nextcloud-www.service=nextcloud

      - traefik.http.middlewares.redirect-www-to-apex.redirectregex.regex=^https://www\.(.+)
      - traefik.http.middlewares.redirect-www-to-apex.redirectregex.replacement=https://$${1}
      - traefik.http.middlewares.redirect-www-to-apex.redirectregex.permanent=true

      - traefik.http.services.nextcloud.loadbalancer.server.port=8080

  nextcloud-php-fpm:
    image: mwaeckerlin/nextcloud:php-fpm
    environment:
      HOST: ${DOMAIN}
      PROTOCOL: https
      WEBROOT:
      SELF_CHECK_URL: https://${DOMAIN}
      MYSQL_HOST: nextcloud-db
      MYSQL_USER: nextcloud
      MYSQL_DATABASE: nextcloud
      OFFICE_PUBLIC_WOPI_URL: http://nextcloud-nginx:8080
      OFFICE_CALLBACK_URL: http://nextcloud-nginx:8080
    secrets:
      - nextcloud_db_password
      - nextcloud_admin_password
    volumes:
      - data:/app/data
      - config:/app/config
      - apps:/app/custom_apps
    depends_on:
      nextcloud-db:
        condition: service_started
    networks:
      - php-network
      - db-network
      - smtp-network
      - collabora-network

  smtp-relay:
    image: mwaeckerlin/smtp-relay
    networks:
      - smtp-network

  collabora:
    image: collabora/code
    environment:
      server_name: ${DOMAIN}
      domain: nextcloud-nginx|${DOMAIN}|www.${DOMAIN}
      aliasgroup1: http://nextcloud-nginx:8080,https://${DOMAIN},https://www.${DOMAIN}
      extra_params: --o:ssl.enable=false --o:ssl.termination=false
    cap_add:
      - MKNOD
    networks:
      - collabora-network

  nextcloud-db:
    image: mariadb
    environment:
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD_FILE: /run/secrets/nextcloud_db_password
      MYSQL_RANDOM_ROOT_PASSWORD: yes
    secrets:
      - nextcloud_db_password
    volumes:
      - db:/var/lib/mysql
    networks:
      - db-network

  access-fix:
    image: mwaeckerlin/allow-write-access
    volumes:
      - data:/app/data
      - config:/app/config
      - apps:/app/custom_apps

secrets:
  nextcloud_db_password:
    environment: NEXTCLOUD_DB_PASSWORD
  nextcloud_admin_password:
    environment: NEXTCLOUD_ADMIN_PASSWORD

volumes:
  traefik-letsencrypt:
  data:
  config:
  apps:
  db:

networks:
  ingress:
    name: ingress
  php-network:
    driver_opts:
      encrypted: 1
  db-network:
    driver_opts:
      encrypted: 1
  smtp-network:
    driver_opts:
      encrypted: 1
  collabora-network:
    driver_opts:
      encrypted: 1
