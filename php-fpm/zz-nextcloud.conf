; Nextcloud pool limit, read by php-fpm after www.conf of mwaeckerlin/php-fpm,
; whose [www] pool it extends. Every PHP worker holds one database connection
; while it answers, so MAX_REQUEST_WORKERS (default 100, the variable of the
; legacy image) stays below max_connections of the database (151 by default).
; Requests above the limit wait in the queue of php-fpm.
[www]
pm.max_children = ${MAX_REQUEST_WORKERS}
